<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wrenn video</title>
    <style>
      @font-face {
        font-family: "Bubblegum Sans";
        src: url("../assets/BubblegumSans-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Figtree";
        src: url("fonts/Figtree-Variable.woff2") format("woff2");
        font-weight: 300 900;
        font-display: block;
      }

      :root {
        /* Brand colors, picked from the Wrenn logo */
        --bg: #082a40;      /* deep navy background */
        --navy: #0a3350;    /* logo wordmark */
        --cream: #fbf7ee;
        --red: #e03a2f;
        --orange: #f5821f;
        --yellow: #f5cf2f;
        --green: #8cbb34;
        --blue: #29a3cc;

        --font-display: "Bubblegum Sans", "Figtree", system-ui, sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        overflow: hidden;
        background: radial-gradient(ellipse at 30% 35%, #0d3a57 0%, var(--bg) 60%);
        color: var(--cream);
        font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
      }

      .stage { position: absolute; inset: 0; overflow: hidden; }

      .dot, .flood {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        will-change: transform;
      }
      .flood { background: var(--cream); z-index: 20; }

      .devices { position: absolute; inset: 0; z-index: 10; }

      .hook, .label, .ending {
        position: absolute;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.01em;
        z-index: 12;
      }
      .hook { text-align: center; }
      .hook.second { color: var(--yellow); }
      .label { text-align: left; }

      .logo { position: absolute; z-index: 21; will-change: transform; }

      .ending { color: var(--navy); text-align: center; z-index: 22; }
      .pill {
        position: absolute;
        border-radius: 999px;
        background: var(--yellow);
        z-index: -1;
        transform-origin: 0 50%;
      }
      .end-dot { position: absolute; border-radius: 50%; z-index: 22; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div id="dots"></div>
      <div class="devices" id="devices"></div>
      <h1 class="hook" id="hook-1">Screenshots in.</h1>
      <h1 class="hook second" id="hook-2">Video out.</h1>
      <div id="labels"></div>
      <div class="flood" id="flood"></div>
      <h2 class="ending" id="ending">Download it free</h2>
    </div>

    <script src="vendor/gsap.min.js"></script>
    <script src="wrenn.js"></script>
    <script>
      (async () => {
        const VIDEO = { size: "youtube", duration: 15, vibe: "playful" };
        const C = Wrenn.canvas(VIDEO.size);
        const v = Wrenn.vibe(VIDEO.vibe);
        const tl = gsap.timeline({ paused: true });
        const S = C.safe;
        const U = C.u;
        const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        await Wrenn.fontsReady();
        const FEATURES = [
          { file: "light-02-home.png", label: "Pick what to make",
            stops: [{ x: 0.5, y: 0.13, zoom: 1.7 }, { x: 0.5, y: 0.41, zoom: 1.35 }] },
          { file: "light-04-template-options.png", label: "Choose size and vibe",
            stops: [{ x: 0.5, y: 0.40, zoom: 1.5 }, { x: 0.5, y: 0.78, zoom: 1.5 }] },
          { file: "light-05-template-upload-filled.png", label: "Drop in your screenshots",
            stops: [{ x: 0.5, y: 0.36, zoom: 1.8 }, { x: 0.62, y: 0.9, zoom: 1.8 }] },
          { file: "light-07-done-new.png", label: "Your video, ready",
            stops: [{ x: 0.6, y: 0.4, zoom: 1.7 }] },
        ];
        const shots = await Wrenn.loadImages(FEATURES.map((f) => "../assets/" + f.file));
        const [logoImg] = await Wrenn.loadImages(["../assets/logo.png"]);

        // ---- Timing (total 15s, hits on a 0.25s grid) ----
        const HOOK_END = 2.25;
        const FEAT = 2.2;
        const T = (i) => HOOK_END + i * FEAT;      // 2.25, 4.45, 6.65, 8.85
        const LOGO = T(FEATURES.length);           // 11.05
        const END = 12.5;

        // ---- Layout ----
        const devMaxW = S.width * 0.52;
        const devMaxH = S.height * 0.84;
        const devCx = S.right - devMaxW / 2 - U * 2;
        const devCy = C.cy;
        const labelW = devCx - devMaxW / 2 - U * 7 - S.left;
        const labelBottom = C.cy + U * 1;

        // Continuity: five brand-colored dots. Each one leaps from a row and
        // grows into the backdrop of the next screen. The last one leads into the logo.
        const D = U * 90;
        const dotSize = U * 4.4;
        const dotS = dotSize / D;
        const dotColors = ["--blue", "--green", "--yellow", "--orange", "--red"].map(css);
        const dotsWrap = document.getElementById("dots");
        const dots = dotColors.map((c, k) => {
          const d = document.createElement("div");
          d.className = "dot";
          d.style.width = d.style.height = D + "px";
          d.style.background = c;
          d.style.zIndex = 2 + k;
          dotsWrap.appendChild(d);
          return d;
        });
        const at = (px, py) => ({ x: px - D / 2, y: py - D / 2 });
        const rowX = (j) => S.left + dotSize / 2 + j * U * 6.5;
        const rowY = C.cy + U * 9;

        // Hook text
        const hook1 = document.getElementById("hook-1");
        const hook2 = document.getElementById("hook-2");
        for (const el of [hook1, hook2]) {
          el.style.fontSize = U * 15 + "px";
          el.style.left = S.left + "px";
          el.style.width = S.width + "px";
          Wrenn.split(el);
        }
        const hookH = hook1.offsetHeight;
        const hookGap = U * 1;
        const hookTop = C.cy - (hookH * 2 + hookGap) / 2 + U * 4;
        hook1.style.top = hookTop + "px";
        hook2.style.top = hookTop + hookH + hookGap + "px";
        const hookRowY = hookTop - U * 7;
        dots.forEach((d, k) => gsap.set(d, Object.assign(at(C.cx + (k - 2) * U * 7, hookRowY), { scale: 0 })));

        // Devices and labels
        const devWrap = document.getElementById("devices");
        const labelWrap = document.getElementById("labels");
        const devices = shots.map((img) => {
          const d = Wrenn.device(img, { maxWidth: devMaxW, maxHeight: devMaxH });
          devWrap.appendChild(d.el);
          d.place(devCx, devCy);
          gsap.set(d.el, { scale: 0 });
          return d;
        });
        const labels = FEATURES.map((f) => {
          const p = document.createElement("p");
          p.className = "label";
          p.textContent = f.label;
          p.style.fontSize = U * 8.5 + "px";
          p.style.left = S.left + "px";
          p.style.width = labelW + "px";
          labelWrap.appendChild(p);
          Wrenn.split(p);
          p.style.top = labelBottom - p.offsetHeight + "px";
          return p;
        });

        // Logo
        const LW = S.width * 0.5;
        const LH = LW * (logoImg.naturalHeight / logoImg.naturalWidth);
        logoImg.className = "logo";
        logoImg.alt = "";
        logoImg.style.width = LW + "px";
        logoImg.style.height = LH + "px";
        logoImg.style.left = C.cx - LW / 2 + "px";
        logoImg.style.top = C.cy - LH / 2 + "px";
        document.getElementById("stage").appendChild(logoImg);
        gsap.set(logoImg, { scale: 0 });

        // Cream flood that wipes from the center into the logo scene
        const flood = document.getElementById("flood");
        const F = Math.hypot(C.width, C.height) + U * 6;
        flood.style.width = flood.style.height = F + "px";
        gsap.set(flood, { x: C.cx - F / 2, y: C.cy - F / 2, scale: 0 });

        // Ending text with a yellow pill behind the last word
        const ending = document.getElementById("ending");
        ending.style.fontSize = U * 13 + "px";
        ending.style.left = S.left + "px";
        ending.style.width = S.width + "px";
        const endWords = Wrenn.split(ending);
        const endTop = C.cy - U * 2;
        ending.style.top = endTop + "px";
        const lastWord = endWords[endWords.length - 1].parentNode;
        const pill = document.createElement("div");
        pill.className = "pill";
        pill.style.left = lastWord.offsetLeft - U * 1.6 + "px";
        pill.style.top = lastWord.offsetTop - U * 0.4 + "px";
        pill.style.width = lastWord.offsetWidth + U * 3.2 + "px";
        pill.style.height = lastWord.offsetHeight + U * 0.8 + "px";
        ending.appendChild(pill);
        gsap.set(pill, { scaleX: 0 });

        const endDotSize = U * 2.6;
        const endDotsY = endTop + ending.offsetHeight + U * 5;
        const endDots = dotColors.map((c, k) => {
          const d = document.createElement("div");
          d.className = "end-dot";
          d.style.width = d.style.height = endDotSize + "px";
          d.style.background = c;
          d.style.left = C.cx + (k - 2) * U * 4.5 - endDotSize / 2 + "px";
          d.style.top = endDotsY + "px";
          document.getElementById("stage").appendChild(d);
          gsap.set(d, { scale: 0 });
          return d;
        });

        // ================= HOOK (0 to 2.25) =================
        dots.forEach((d, k) => {
          tl.to(d, { scale: dotS, duration: v.d(0.6), ease: v.pop }, k * 0.125);
        });
        Wrenn.reveal(tl, hook1, { at: 0.25, vibe: v });
        Wrenn.reveal(tl, hook2, { at: 0.75, vibe: v });
        tl.to(hook2, { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 1.25);
        // dots do a little wave while the line holds
        dots.forEach((d, k) => {
          tl.to(d, { y: hookRowY - D / 2 - U * 1.6, duration: 0.2, ease: "sine.out", yoyo: true, repeat: 1 }, 1.0 + k * 0.08);
        });
        Wrenn.hide(tl, hook1, { at: 1.75, vibe: v });
        Wrenn.hide(tl, hook2, { at: 1.8, vibe: v });
        // the first dot stays put for its leap; the rest glide under the labels
        dots.slice(1).forEach((d, j) => {
          tl.to(d, Object.assign(at(rowX(j), rowY), { duration: v.d(0.55), ease: v.move }), 1.8 + j * 0.03);
        });

        // ================= FEATURES =================
        FEATURES.forEach((f, i) => {
          const t0 = T(i);
          const dev = devices[i];
          const dot = dots[i];

          // dot leaps into place behind the frame and grows into its backdrop
          tl.to(dot, Object.assign(at(devCx, devCy), { duration: v.d(0.5), ease: v.move }), t0 - 0.15);
          tl.to(dot, { scale: 1, duration: v.d(0.85), ease: v.pop }, t0);
          tl.to(dot, { scale: 1.04, duration: 1.1, ease: "sine.inOut" }, t0 + 0.95);
          // the rest of the row closes the gap
          for (let k = i + 1; i > 0 && k < dots.length; k++) {
            tl.to(dots[k], { x: rowX(k - i - 1) - D / 2, duration: v.d(0.45), ease: v.enter }, t0 + 0.05 + (k - i) * 0.04);
          }

          // the screen pops out of the center of the new color
          tl.fromTo(dev.el, { scale: 0, rotation: -10, y: U * 8 },
            { scale: 1, rotation: 0, y: 0, duration: v.d(0.7), ease: v.enter }, t0 + 0.1);
          tl.to(dev.el, { y: -U * 1.2, rotation: 0.6, duration: 1.0, ease: "sine.inOut" }, t0 + 0.85);

          Wrenn.reveal(tl, labels[i], { at: t0 + 0.25, vibe: v });

          // zoom to the parts that matter
          f.stops.forEach((s, n) => {
            dev.focus(tl, Object.assign({}, s, {
              at: t0 + 0.65 + n * 0.7,
              duration: v.d(n === 0 && f.stops.length === 1 ? 0.9 : 0.6),
              ease: v.move,
            }));
          });

          // out: label lifts away, screen tucks back into the center
          Wrenn.hide(tl, labels[i], { at: t0 + FEAT - 0.4, vibe: v });
          tl.to(dev.el, { scale: 0, rotation: 8, duration: 0.28, ease: v.exit }, t0 + FEAT - 0.3);
        });

        // ================= LOGO (11.05 to 12.5) =================
        const red = dots[4];
        tl.to(red, Object.assign(at(C.cx, C.cy), { duration: v.d(0.45), ease: v.move }), LOGO - 0.25);
        tl.to(red, { scale: 1.1, duration: v.d(0.8), ease: v.pop }, LOGO - 0.05);
        tl.to(flood, { scale: 1, duration: v.d(0.75), ease: "power3.out" }, LOGO + 0.1);
        tl.fromTo(logoImg, { scale: 0.2, rotation: -8, autoAlpha: 0 },
          { scale: 1, rotation: 0, autoAlpha: 1, duration: v.d(1.0), ease: v.pop }, LOGO + 0.25);
        tl.to(logoImg, { scale: 1.06, duration: 0.11, ease: "power2.out", yoyo: true, repeat: 1 }, LOGO + 1.15);

        // ================= ENDING (12.5 to 15) =================
        tl.to(logoImg, { y: -U * 17, scale: 0.62, duration: v.d(0.6), ease: v.move }, END - 0.05);
        tl.to(logoImg, { y: -U * 18.2, duration: 1.4, ease: "sine.inOut" }, END + 0.6);
        Wrenn.reveal(tl, ending, { at: END + 0.1, vibe: v });
        tl.to(pill, { scaleX: 1, duration: v.d(0.5), ease: v.enter }, END + 0.5);
        tl.fromTo(ending, { scale: 1 }, { scale: 1.035, duration: 1.6, ease: "sine.inOut" }, END + 0.9);
        endDots.forEach((d, k) => {
          tl.to(d, { scale: 1, duration: v.d(0.6), ease: v.pop }, END + 0.75 + k * 0.125);
          tl.to(d, { y: -U * 1.4, duration: 0.25, ease: "sine.out", yoyo: true, repeat: 1 }, END + 1.5 + k * 0.1);
        });

        Wrenn.install({ timeline: tl, duration: VIDEO.duration });

        // Preview helper: open with #t=5 to jump to a moment.
        window.wrennReady.then(() => {
          const m = location.hash.match(/t=([\d.]+)/);
          if (m) window.seek(parseFloat(m[1]));
        });
      })().catch(Wrenn.fail);
    </script>
  </body>
</html>
